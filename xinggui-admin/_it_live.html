<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>admin live integration</title></head>
<body><pre id="out">running...</pre>
<script src="/assets/js/api.js"></script>
<script>

/* RFC 6238：SHA-1 / 6 位 / 30s，与后端 auth.VerifyTOTP 完全一致 */
function b32decode(s) {
  const A = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  s = String(s || "").toUpperCase().replace(/=+$/, "").replace(/\s/g, "");
  let bits = "";
  for (const ch of s) {
    const v = A.indexOf(ch);
    if (v < 0) throw new Error("bad base32 char: " + ch);
    bits += v.toString(2).padStart(5, "0");
  }
  const bytes = [];
  for (let i = 0; i + 8 <= bits.length; i += 8) bytes.push(parseInt(bits.slice(i, i + 8), 2));
  return new Uint8Array(bytes);
}
async function totpNow(secret) {
  const key = await crypto.subtle.importKey("raw", b32decode(secret), { name: "HMAC", hash: "SHA-1" }, false, ["sign"]);
  const counter = Math.floor(Date.now() / 1000 / 30);
  const buf = new ArrayBuffer(8);
  const dv = new DataView(buf);
  dv.setUint32(0, Math.floor(counter / 4294967296));
  dv.setUint32(4, counter >>> 0);
  const mac = new Uint8Array(await crypto.subtle.sign("HMAC", key, buf));
  const off = mac[mac.length - 1] & 0x0f;
  const code = ((mac[off] & 0x7f) << 24 | mac[off + 1] << 16 | mac[off + 2] << 8 | mac[off + 3]) % 1000000;
  return String(code).padStart(6, "0");
}

const R = { pass: 0, fail: 0, rows: [] };
const P = (n, ok, detail) => { ok ? R.pass++ : R.fail++; R.rows.push((ok ? "PASS " : "FAIL ") + n + (detail ? "  ::  " + detail : "")); };
const tap = async (name, fn) => { try { return await fn(); } catch (e) { P(name + " [threw]", false, e.message); return null; } };

(async () => {
  API.mock = false;
  API.autoMock = false;

  const cred = await fetch("/it-cred.json").then(r => r.json());
  // TOTP 现场计算：避免静态文件里的 6 位码过期（窗口仅 30s）
  const totp = await totpNow(cred.secret);
  P("本地算出 6 位 TOTP", /^[0-9]{6}$/.test(totp), totp);
  const login = await tap("POST /login", () => API.login(cred.password, totp));
  P("拿到 token 且非空", !!(login && login.token && login.token.length > 100), login ? "len=" + login.token.length : "null");
  P("角色 superadmin", !!(login && login.role === "superadmin"), login && login.role);
  P("运行模式 LIVE 非 mock", API.mock === false && API.reachable === true, "mock=" + API.mock + " reachable=" + API.reachable);

  const ov = await tap("overview", () => API.overview());
  P("overview.totalUsers 数字", ov && typeof ov.totalUsers === "number", ov && "total=" + ov.totalUsers);
  P("overview.trend 长 30", ov && Array.isArray(ov.trend) && ov.trend.length === 30, ov && "len=" + (ov.trend || []).length);
  P("todayResolves 有真实解析", ov && ov.todayResolves >= 3, ov && "today=" + ov.todayResolves);

  const rs = await tap("statsResolve", () => API.statsResolve());
  const rsItems = (rs && rs.items) || [];
  P("stats/resolve 有平台行", rsItems.length > 0, "rows=" + rsItems.length);
  P("platform 为短码", rsItems.every(r => ["wy","tx","kg","kw"].includes(r.platform)), rsItems.map(r => r.platform).join(","));

  const hl = await tap("health", () => API.health());
  P("health.uptime 非空", !!(hl && hl.uptime), hl && hl.uptime);
  P("health.dbLatencyMs 数字", hl && typeof hl.dbLatencyMs === "number", hl && hl.dbLatencyMs);

  const er = await tap("statsErrors", () => API.statsErrors({ limit: 8 }));
  P("stats/errors items 数组", er && Array.isArray(er.items), er && "n=" + (er.items || []).length);

  const sc = await tap("statsSearches", () => API.statsSearches());
  const scItems = (sc && sc.items) || [];
  P("热门搜索含 晴天", scItems.some(x => x.keyword === "晴天"), JSON.stringify(scItems.slice(0, 3)));

  const us = await tap("users", () => API.users({ page: 1, pageSize: 10 }));
  const usItems = (us && us.items) || [];
  P("用户列表有真实数据", usItems.length > 0, "total=" + (us && us.total));
  const u0 = usItems.find(x => x.username === "ittest01");
  P("列表含 ittest01", !!u0, u0 && u0.status);
  P("列表项字段完整", !!(u0 && u0.maxDevices != null && u0.registeredAt != null), u0 && JSON.stringify({ d: u0.devices, m: u0.maxDevices }));

  const dt = await tap("userDetail", () => API.user("ittest01"));
  P("详情 resolveCount per-user = 3", dt && dt.resolveCount === 3, dt && "resolveCount=" + dt.resolveCount);
  P("详情 role/status 存在", !!(dt && dt.role && dt.status), dt && dt.role + "/" + dt.status);
  P("详情 deviceList 数组", dt && Array.isArray(dt.deviceList), dt && "devices=" + dt.devices);

  for (const pair of [["favorites", () => API.favorites("ittest01")], ["playlists", () => API.playlists("ittest01")],
                      ["history", () => API.history("ittest01")], ["downloads", () => API.downloads("ittest01")],
                      ["searches", () => API.searches("ittest01")]]) {
    const d = await tap("tab " + pair[0], pair[1]);
    P("tab " + pair[0] + " items 数组", d && Array.isArray(d.items), d && "n=" + d.items.length);
  }

  const cfg = await tap("config", () => API.config());
  P("platformDisabled 含 4 短码", cfg && ["wy","tx","kg","kw"].every(p => typeof cfg.platformDisabled[p] === "boolean"), cfg && JSON.stringify(cfg.platformDisabled));
  P("resolveOrder 全短码", cfg && cfg.resolveOrder.every(p => ["wy","tx","kg","kw"].includes(p)), cfg && cfg.resolveOrder.join(","));
  P("maxDevices 反映写入=3", cfg && cfg.maxDevices === 3, cfg && "max=" + cfg.maxDevices);
  P("normPlatform(netease)=wy", API.normPlatform("netease") === "wy", API.normPlatform("netease"));

  const saved = await tap("saveConfig", async () => { const c = Object.assign({}, cfg); c.cacheTtlSeconds = 1800; return API.saveConfig(c); });
  P("PUT /config 生效", !!(saved && saved.cacheTtlSeconds === 1800), saved && "ttl=" + saved.cacheTtlSeconds);

  const off = await tap("disablePlatform kg", () => API.disablePlatform("kg", true));
  P("禁用 kg 返回 true", !!(off && off.disabled === true && off.platform === "kg"), off && JSON.stringify(off));
  const cfg2 = await API.config();
  P("禁用后 kg=true", cfg2.platformDisabled.kg === true, String(cfg2.platformDisabled.kg));
  await API.disablePlatform("kg", false);
  const cfg3 = await API.config();
  P("复原后 kg=false", cfg3.platformDisabled.kg === false, String(cfg3.platformDisabled.kg));

  const ver = await tap("version", () => API.version());
  P("latestVersion = 1.3.0", !!(ver && ver.latestVersion === "1.3.0"), ver && ver.latestVersion);
  P("minVersion 正确 = 1.0.0", !!(ver && ver.minVersion === "1.0.0"), ver && ver.minVersion);
  P("forceUpdate = true", !!(ver && ver.forceUpdate === true), ver && String(ver.forceUpdate));
  P("updateSha256 64 位", !!(ver && /^[0-9a-f]{64}$/.test(ver.updateSha256)), ver && ver.updateSha256);

  const sv = await tap("saveVersion", () => API.saveVersion(ver));
  P("PUT /version ok", !!(sv && sv.ok === true), sv && JSON.stringify(sv));

  await API.logout();
  P("logout 后 token 清空", API.token === null, "token=" + API.token);
  const after = await (async () => { try { await API.users({ page: 1, pageSize: 1 }); return "unexpected-ok"; } catch (e) { return e.status + "/" + e.code; } })();
  P("登出后 401", /^401/.test(after), after);

  document.getElementById("out").textContent = "== " + R.pass + " passed, " + R.fail + " failed ==\n" + R.rows.join("\n");
})().catch(e => { document.getElementById("out").textContent = "== 0 passed, 1 failed ==\nFATAL " + (e && e.message); });
</script></body></html>
